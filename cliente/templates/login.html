{% extends 'Home.html' %}
{% block title %}SushiBom · Entrar{% endblock %}

{% block content %}
<div class="container">
  <div class="titulo-pagina">
    <span class="jp" aria-hidden="true">入口</span>
    <h1>Entrar</h1>
  </div>

  <form method="post" class="painel">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% if erro %}<div class="aviso mb-4" role="alert">{{ erro }}</div>{% endif %}

    <div class="mb-4">
      <label for="username" class="form-label">Usuário</label>
      <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Senha</label>
      <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn btn-sumi w-100">Entrar</button>
    <p class="text-center mt-4 mb-0 small">
      Ainda não tem conta? <a href="{% url 'cadastrar_cliente' %}" class="text-decoration-underline">Cadastre-se</a>
    </p>
  </form>
</div>
{% endblock %}
